#cloud-config
# Replace the SSH public-key marker with the operator's existing public key.
# No API key, database password or SSH private key belongs in user-data.
hostname: partageonsleau-demo-egress-proxy
manage_etc_hosts: true
disable_root: true
ssh_pwauth: false
users:
  - name: pe-admin
    groups: [sudo]
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    lock_passwd: true
    ssh_authorized_keys:
      - __OPERATOR_SSH_PUBLIC_KEY__
package_update: true
packages:
  - squid
  - nftables
  - curl
  - unattended-upgrades
write_files:
  - path: /etc/ssh/sshd_config.d/00-pe.conf
    permissions: '0644'
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AuthenticationMethods publickey
      AllowUsers pe-admin
      AllowAgentForwarding no
      X11Forwarding no
      AllowTcpForwarding local
      PermitOpen 172.16.12.2:5432 172.16.12.3:6379 127.0.0.1:3128
  - path: /etc/sysctl.d/90-pe-private-ipv4.conf
    permissions: '0644'
    content: |
      net.ipv6.conf.all.disable_ipv6=1
      net.ipv6.conf.default.disable_ipv6=1
      net.ipv4.ip_forward=0
  - path: /etc/squid/squid.conf
    permissions: '0644'
    content: |
      # This VM has only a private NIC; inbound access is filtered below.
      http_port 0.0.0.0:3128
      visible_hostname partageonsleau-demo-egress-proxy
      acl demo_clients src 172.16.12.0/22 127.0.0.1/32
      acl CONNECT method CONNECT
      acl tls_port port 443
      acl allowed_destinations dstdomain -n api.ipify.org
      acl forbidden_addresses dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
      http_access deny !demo_clients
      http_access deny !CONNECT
      http_access deny !tls_port
      http_access deny !allowed_destinations
      http_access deny forbidden_addresses
      http_access allow demo_clients CONNECT tls_port allowed_destinations
      http_access deny all
      # No TLS interception and no URLs, query strings or credentials in logs.
      cache deny all
      access_log none
      cache_store_log none
      forwarded_for delete
      via off
      connect_timeout 10 seconds
      read_timeout 2 minutes
      shutdown_lifetime 3 seconds
  - path: /etc/nftables.conf
    permissions: '0644'
    content: |
      #!/usr/sbin/nft -f
      flush ruleset
      table inet pe_private {
        chain input {
          type filter hook input priority 0; policy drop;
          iifname "lo" accept
          ct state established,related accept
          ct state invalid drop
          ip saddr 172.16.12.0/22 tcp dport {22, 3128} accept
          udp sport 67 udp dport 68 accept
          ip protocol icmp accept
        }
        chain forward {
          type filter hook forward priority 0; policy drop;
        }
        chain output {
          type filter hook output priority 0; policy accept;
          oifname "lo" accept
          meta nfproto ipv6 reject
          # Keep Scaleway's resolver 169.254.169.254 reachable, not metadata.
          ip daddr 169.254.42.42 reject
        }
      }
runcmd:
  - [sysctl, --system]
  - [sshd, -t]
  - [systemctl, restart, ssh]
  - [nft, -c, -f, /etc/nftables.conf]
  - [systemctl, enable, nftables]
  - [systemctl, restart, nftables]
  - [squid, -k, parse]
  - [systemctl, enable, squid]
  - [systemctl, restart, squid]
