Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
TCPSocket 3310
TCPAddr 127.0.0.1
MaxThreads 2
MaxQueue 4
StreamMaxLength 50000000
CommandReadTimeout 10
ReadTimeout 120
MaxScanTime 90000
MaxScanSize 200M
# ClamAV's ZIP extractor truncates to MaxFileSize before its ordinary limit
# check. Keep that ceiling above MaxScanSize so truncation cannot look clean:
# even the truncated content must exceed the total scan budget and raise an alert.
MaxFileSize 400M
MaxRecursion 16
MaxFiles 10000
AlertExceedsMax yes
AlertEncrypted yes
AlertBrokenExecutables yes
AlertBrokenMedia yes
HeuristicAlerts yes
HeuristicScanPrecedence no
SelfCheck 0
ConcurrentDatabaseReload no
OfficialDatabaseOnly yes
LogClean no
LogVerbose no
LogTime no
LeaveTemporaryFiles no
