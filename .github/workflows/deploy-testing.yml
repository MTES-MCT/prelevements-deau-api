name: Deploy (testing) to Scaleway

on:
  push:
    branches: ["testing"]

permissions:
  contents: read

concurrency:
  group: deploy-testing
  cancel-in-progress: true

jobs:
  test_build_deploy:
    runs-on: ubuntu-latest
    environment: testing

    env:
      TZ: Europe/Paris
      SCW_REGION: ${{ vars.SCW_REGION }}
      SCW_REGISTRY_ENDPOINT: ${{ vars.SCW_REGISTRY_ENDPOINT }}
      SCW_IMAGE_NAME: ${{ vars.SCW_IMAGE_NAME }}
      SCW_SERVERLESS_CONTAINER_ID_TESTING_API: ${{ secrets.SCW_SERVERLESS_CONTAINER_ID_TESTING_API }}
      SCW_SERVERLESS_CONTAINER_ID_TESTING_WORKER: ${{ secrets.SCW_SERVERLESS_CONTAINER_ID_TESTING_WORKER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SUBMODULES_SSH_KEY }}

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install deps
        run: npm ci

      #- name: Test (if present)
      #  run: npm test --if-present

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SCW_REGISTRY_ENDPOINT }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            ENV_NAME=testing
          secrets: |
            GITHUB_TOKEN=${{ github.token }}
          tags: |
            ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}:testing-${{ github.sha }}

      - name: Check image size and publish testing-latest
        env:
          IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}:testing-${{ github.sha }}
          LATEST_IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}:testing-latest
          DOCKER_IMAGE_MAX_BYTES: 1000000000
        run: |
          docker pull "$IMAGE_REF"
          trap 'docker image rm "$LATEST_IMAGE_REF" "$IMAGE_REF" >/dev/null 2>&1 || true' EXIT
          npm run check:image-size -- "$IMAGE_REF"
          docker run --rm --entrypoint /bin/sh "$IMAGE_REF" -c \
            'test -r /app/deploy/certs/testing/redis-ca.pem && test -r /app/deploy/certs/testing/postgres-ca.pem'
          docker tag "$IMAGE_REF" "$LATEST_IMAGE_REF"
          docker push "$LATEST_IMAGE_REF"

      - name: Install Scaleway CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | VERSION=2.56.0 sh
          scw version

      - name: Run DB migrations (blocking)
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: fr-par
          SCW_JOB_DEFINITION_ID_TESTING_DB: ${{ secrets.SCW_JOB_DEFINITION_ID_TESTING_DB }}
        run: |
          job_run="$(scw jobs definition start "$SCW_JOB_DEFINITION_ID_TESTING_DB" region=fr-par --wait -o json)"
          job_run_id="$(jq -er '.id' <<< "$job_run")"
          job_state="$(jq -er '.state' <<< "$job_run")"

          if [[ "$job_state" != "succeeded" ]]; then
            echo "Database migration job $job_run_id finished with state: $job_state"
            echo "$job_run"
            exit 1
          fi

      - name: Deploy API to Scaleway Serverless Container (testing)
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: ${{ env.SCW_REGION }}
          SCW_REGISTRY_ENDPOINT: ${{ env.SCW_REGISTRY_ENDPOINT }}
          SCW_IMAGE_NAME: ${{ env.SCW_IMAGE_NAME }}
        run: |
          scw container container update "$SCW_SERVERLESS_CONTAINER_ID_TESTING_API" \
            image="$SCW_REGISTRY_ENDPOINT/$SCW_IMAGE_NAME:testing-${{ github.sha }}" \
            environment-variables.MAIL_SUBJECT_PREFIX="[TESTING] " \
            liveness-probe.http.path=/healthz \
            liveness-probe.interval=10s \
            liveness-probe.timeout=2s \
            liveness-probe.failure-threshold=5 \
            startup-probe.http.path=/healthz \
            startup-probe.interval=5s \
            startup-probe.timeout=2s \
            startup-probe.failure-threshold=30

      - name: Deploy WORKER to Scaleway Serverless Container (testing)
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: ${{ env.SCW_REGION }}
          SCW_REGISTRY_ENDPOINT: ${{ env.SCW_REGISTRY_ENDPOINT }}
          SCW_IMAGE_NAME: ${{ env.SCW_IMAGE_NAME }}
        run: |
          scw container container update "$SCW_SERVERLESS_CONTAINER_ID_TESTING_WORKER" \
            image="$SCW_REGISTRY_ENDPOINT/$SCW_IMAGE_NAME:testing-${{ github.sha }}" \
            command.0=node \
            command.1=worker.js
