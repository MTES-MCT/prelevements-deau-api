name: Deploy (demo) to Scaleway

on:
  push:
    branches: ["demo"]

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  test_build_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    env:
      TZ: Europe/Paris
      SCW_REGION: ${{ vars.SCW_REGION }}
      SCW_REGISTRY_ENDPOINT: ${{ vars.SCW_REGISTRY_ENDPOINT }}
      SCW_IMAGE_NAME: ${{ vars.SCW_IMAGE_NAME }}
      SCW_SERVERLESS_CONTAINER_ID_DEMO_API: ${{ secrets.SCW_SERVERLESS_CONTAINER_ID_DEMO_API }}
      SCW_SERVERLESS_CONTAINER_ID_DEMO_WORKER: ${{ secrets.SCW_SERVERLESS_CONTAINER_ID_DEMO_WORKER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SUBMODULES_SSH_KEY }}

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Generate Prisma client and run tests
        timeout-minutes: 10
        run: |
          npx prisma generate
          # Large in-memory fixtures can exceed AVA's default 10s inactivity window on CI.
          npm test -- --concurrency=3 --timeout=2m

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SCW_REGISTRY_ENDPOINT }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            ENV_NAME=demo
          secrets: |
            GITHUB_TOKEN=${{ github.token }}
          tags: |
            ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}:demo-${{ github.sha }}

      - name: Check immutable image size and certificates
        env:
          IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          DOCKER_IMAGE_MAX_BYTES: 1000000000
        run: |
          docker pull "$IMAGE_REF"
          trap 'docker image rm "$IMAGE_REF" >/dev/null 2>&1 || true' EXIT
          npm run check:image-size -- "$IMAGE_REF"
          docker run --rm --entrypoint /bin/sh "$IMAGE_REF" -c \
            'test -r /app/deploy/certs/demo/redis-ca.pem && test -r /app/deploy/certs/demo/postgres-ca.pem && test -r /app/scripts/network/migration-service.js'

      - name: Migrate privately and deploy the same digest to demo
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEMO_MIGRATION_CONTAINER_ID: ${{ vars.SCW_DEMO_MIGRATION_CONTAINER_ID }}
          SCW_DEMO_MIGRATION_NAMESPACE_ID: ${{ vars.SCW_DEMO_MIGRATION_NAMESPACE_ID }}
          DEMO_MIGRATION_INVOKE_SECRET: ${{ secrets.DEMO_MIGRATION_INVOKE_SECRET }}
          IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: node deploy/network/ci-demo-deploy.js

      - name: Publish demo-latest after successful deployment
        env:
          IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          LATEST_IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}:demo-latest
        run: |
          docker pull "$IMAGE_REF"
          trap 'docker image rm "$LATEST_IMAGE_REF" "$IMAGE_REF" >/dev/null 2>&1 || true' EXIT
          docker tag "$IMAGE_REF" "$LATEST_IMAGE_REF"
          docker push "$LATEST_IMAGE_REF"
