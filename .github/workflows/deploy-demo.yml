name: Deploy (demo) to Scaleway

on:
  push:
    branches: ["demo"]

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  image:
    name: Build and validate immutable image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
      release: ${{ steps.candidate.outputs.release }}
    env:
      TZ: Europe/Paris
      SCW_REGION: ${{ vars.SCW_REGION }}
      SCW_REGISTRY_ENDPOINT: ${{ vars.SCW_REGISTRY_ENDPOINT }}
      SCW_IMAGE_NAME: ${{ vars.SCW_IMAGE_NAME }}
      # Build records and private submodule layers must not become GitHub artifacts.
      DOCKER_BUILD_RECORD_UPLOAD: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ssh-key: ${{ secrets.SUBMODULES_SSH_KEY }}
          persist-credentials: false

      - name: Use project Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Verify private image and cache registry
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
        run: node .github/scripts/check-private-registry.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.SCW_REGISTRY_ENDPOINT }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}:buildcache-api-demo
          cache-to: type=registry,ref=${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}:buildcache-api-demo,mode=max,image-manifest=true,oci-mediatypes=true
          push: true
          build-args: |
            ENV_NAME=demo
          secrets: |
            GITHUB_TOKEN=${{ github.token }}
          tags: |
            ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}:demo-${{ github.sha }}


      - name: Install image vulnerability scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Scan exact candidate image before any deployment
        env:
          IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: bash .github/scripts/scan-image.sh "$IMAGE_REF"

      - name: Smoke test native modules from the scanned image
        env:
          IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: bash .github/scripts/smoke-image.sh "$IMAGE_REF"

      - name: Retain image vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-audit-${{ github.run_id }}
          path: .artifacts/security/image-audit.json
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      - name: Check immutable image size and certificates
        env:
          IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          DOCKER_IMAGE_MAX_BYTES: 1000000000
        run: |
          docker pull "$IMAGE_REF"
          trap 'docker image rm "$IMAGE_REF" >/dev/null 2>&1 || true' EXIT
          sh deploy/check-image-size.sh "$IMAGE_REF"
          docker run --rm --entrypoint /bin/sh "$IMAGE_REF" -c \
            'test -r /app/deploy/certs/demo/redis-ca.pem && test -r /app/deploy/certs/demo/postgres-ca.pem && test -r /app/scripts/network/migration-service.js'

      - name: Export only the fully checked candidate digest
        id: candidate
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import {appendFileSync} from "node:fs";
            assert.match(process.env.CANDIDATE_DIGEST, /^sha256:[a-f0-9]{64}$/);
            appendFileSync(process.env.GITHUB_OUTPUT, "digest=" + process.env.CANDIDATE_DIGEST + "\nrelease=" + process.env.GITHUB_SHA + "\n");
          '

  test_build_deploy:
    needs: [quality, image]
    if: ${{ needs.quality.result == 'success' && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TZ: Europe/Paris
      SCW_REGION: ${{ vars.SCW_REGION }}
      SCW_REGISTRY_ENDPOINT: ${{ vars.SCW_REGISTRY_ENDPOINT }}
      SCW_IMAGE_NAME: ${{ vars.SCW_IMAGE_NAME }}
      SCW_SERVERLESS_CONTAINER_ID_DEMO_API: ${{ secrets.SCW_SERVERLESS_CONTAINER_ID_DEMO_API }}
      SCW_SERVERLESS_CONTAINER_ID_DEMO_WORKER: ${{ secrets.SCW_SERVERLESS_CONTAINER_ID_DEMO_WORKER }}


    steps:
      - name: Checkout deployment helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use project Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Verify candidate belongs to this release
        env:
          CANDIDATE_DIGEST: ${{ needs.image.outputs.digest }}
          CANDIDATE_RELEASE: ${{ needs.image.outputs.release }}
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            assert.equal(process.env.CANDIDATE_RELEASE, process.env.GITHUB_SHA);
            assert.match(process.env.CANDIDATE_DIGEST, /^sha256:[a-f0-9]{64}$/);
          '
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to Scaleway Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.SCW_REGISTRY_ENDPOINT }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Migrate through the private service and deploy API and worker (demo)
        env:
          IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}@${{ needs.image.outputs.digest }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEMO_MIGRATION_CONTAINER_ID: ${{ vars.SCW_DEMO_MIGRATION_CONTAINER_ID }}
          SCW_DEMO_MIGRATION_NAMESPACE_ID: ${{ vars.SCW_DEMO_MIGRATION_NAMESPACE_ID }}
          DEMO_MIGRATION_INVOKE_SECRET: ${{ secrets.DEMO_MIGRATION_INVOKE_SECRET }}
        run: node deploy/network/ci-demo-deploy.js

      - name: Publish environment alias only after verified deployment
        env:
          IMAGE_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}@${{ needs.image.outputs.digest }}
          ALIAS_REF: ${{ env.SCW_REGISTRY_ENDPOINT }}/${{ env.SCW_IMAGE_NAME }}:demo-latest
        run: docker buildx imagetools create --tag "$ALIAS_REF" "$IMAGE_REF"
