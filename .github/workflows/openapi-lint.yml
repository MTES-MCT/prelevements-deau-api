name: OpenAPI Lint

on:
  pull_request:
    paths:
      - 'docs/openapi.yaml'
      - '.spectral.yaml'
      - 'package.json'
  push:
    branches: [ main, improve-timeseries ]
    paths:
      - 'docs/openapi.yaml'
      - '.spectral.yaml'
      - 'package.json'

jobs:
  spectral:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use project Node.js version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Use locked npm version
        run: npm install --global "$(node -p 'require("./package.json").packageManager')" --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Lint OpenAPI spec
        run: npm run lint:openapi
