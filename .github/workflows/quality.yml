name: Quality and security

on:
  pull_request:
    branches: [testing, demo, prod]
  workflow_call:

permissions:
  contents: read

jobs:
  security:
    name: Dependency and workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use locked npm version
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')" --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci
      - name: Test CI sharding and private cache guards
        run: node --test .github/scripts/ci-guards.test.mjs
      - name: Test audit policy
        run: npx --no-install ava scripts/security/__tests__/audit-dependencies.js
      - name: Audit all dependencies with expiring development exception
        run: node scripts/security/audit-dependencies.js
      - name: Audit production dependencies
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p .artifacts/security
          npm audit --omit=dev --audit-level=low --json | tee .artifacts/security/npm-audit-production.json
      - name: Validate workflows and shell scripts
        if: ${{ !cancelled() }}
        run: bash .github/scripts/check-workflows.sh
      - name: Retain audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audits
          path: .artifacts/security/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

  test_shards:
    name: API tests shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: security_tests
          POSTGRES_PASSWORD: security_tests_only
          POSTGRES_DB: security_tests
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U security_tests -d security_tests"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI_NODE_INDEX: ${{ matrix.shard }}
      CI_NODE_TOTAL: '2'
      NODE_ENV: test
      TZ: Europe/Paris
      FRONT_URL: ''
      DATABASE_URL: postgresql://security_tests:security_tests_only@127.0.0.1:55439/security_tests
      PUBLIC_STATS_TEST_DATABASE_URL: postgresql://security_tests:security_tests_only@127.0.0.1:55439/security_tests
      REDIS_URL: redis://127.0.0.1:6379/0
      SEARCH_CACHE_ENABLED: 'false'
      METER_INTEGRATION_TESTS: '1'
      DROPT_INTEGRATION_TESTS: '1'
      QUEUE_INTEGRATION_TESTS: '1'
      SENTRY_DSN: ''
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '65534'
      SMTP_FROM: test@example.test
      SMTP_IGNORE_TLS: 'true'
      SMTP_USER: ''
      SMTP_PASSWORD: ''
      S3_ENDPOINT: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: api
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: api/.nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')" --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npx --no-install prisma generate
      - name: Migrate a new database and verify idempotence
        run: |
          npm run migrate:prisma
          npm run migrate:prisma
      - run: npm run lint
        if: matrix.shard == 0
      - run: npm run lint:openapi
        if: matrix.shard == 0
      - name: Native AVA partition including database integrations, with raw V8 coverage
        run: node .github/scripts/ci-shards.mjs run
      - name: Retain shard inventory and raw coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-coverage-shard-${{ matrix.shard }}
          path: api/coverage/shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # Keep the existing required-check name and fail closed on any missing/failed shard.
  tests:
    name: API quality, migrations and integration tests
    if: always()
    needs: [security, test_shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - name: Require every quality job to succeed
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
          SHARDS_RESULT: ${{ needs.test_shards.result }}
        run: test "$SECURITY_RESULT" = success && test "$SHARDS_RESULT" = success
        working-directory: .
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: api
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: api/.nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Use locked npm and dependencies for the coverage merger
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')" --ignore-scripts --no-audit --no-fund
          npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-coverage-shard-0
          path: api/coverage/shard-0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-coverage-shard-1
          path: api/coverage/shard-1
      - name: Verify complete disjoint execution and merge V8 coverage
        run: node .github/scripts/ci-shards.mjs merge
      - name: Retain merged test coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-coverage
          path: |
            api/coverage/
            !api/coverage/shard-*/**
            !api/coverage/merged-v8/**
          if-no-files-found: error
          retention-days: 14
          overwrite: true
