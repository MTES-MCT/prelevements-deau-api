                declarationsFailed:
                  type: integer
                  minimum: 0
                  description: Déclarations hors télérelève dont le traitement a échoué.
                telemetryTransmissionsReceived: {type: integer, minimum: 0}
                telemetryTransmissionsFailed: {type: integer, minimum: 0}
                notificationRecipientsSent: {type: integer, minimum: 0}
                notificationRecipientsFailed: {type: integer, minimum: 0}
            activity:
              type: object
              required: [daily]
              properties:
                daily:
                  type: array
                  items:
                    type: object
                    required: [date, declarations, manualDeclarations, spreadsheetDeclarations, otherDeclarations, failed]
