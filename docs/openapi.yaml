openapi: 3.1.0
info:
  title: Prélèvements d'eau API
  version: 1.0.0
  description: API HTTP de Partageons l'eau pour les déclarations, référentiels, séries temporelles et imports.
servers:
  - url: http://localhost:5000/api
    description: Local
tags:
  - name: Administration
  - name: Auth
  - name: Dashboard
  - name: Declarants
  - name: Declarations
  - name: Sources
  - name: Instruction
  - name: Referentiels
  - name: Series
  - name: Stats
  - name: Zones
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Vérifier que le processus HTTP répond
      description: Sonde publique sans accès à la session, à l’API métier ni à la base de données.
      responses:
        '200':
          description: Processus disponible
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean, const: true}
  /auth/request:
    post:
      tags: [Auth]
      operationId: requestAuth
      summary: Demander un lien de connexion
      description: Envoie un jeton de connexion à l'adresse email fournie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '204': {description: Demande acceptée}
        default: {$ref: '#/components/responses/Error'}
  /auth/verify:
    post:
      tags: [Auth]
      operationId: verifyAuthToken
      summary: Vérifier un jeton de connexion
      description: Crée une session à partir d'un jeton d'authentification valide.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '200':
          description: Session créée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSession'}
        default: {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Fermer la session
      description: Supprime la session courante.
      responses:
        '204': {description: Session supprimée}
        default: {$ref: '#/components/responses/Error'}
  /info:
    get:
      tags: [Auth]
      operationId: getInfo
      summary: Lire la session courante
      description: Retourne l'utilisateur authentifié et ses rôles.
      responses:
        '200':
          description: Informations de session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSession'}
        default: {$ref: '#/components/responses/Error'}
  /declarations:
    post:
      tags: [Declarations]
      operationId: createDeclaration
      summary: Créer une déclaration avec fichiers
      description: Crée une déclaration déposée par un déclarant et stocke les fichiers associés.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Déclaration créée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Declaration'}
        default: {$ref: '#/components/responses/Error'}
  /declarations/quick:
    post:
      tags: [Declarations]
      operationId: createQuickDeclaration
      summary: Créer une saisie rapide
      description: Crée une déclaration rapide depuis des index ou volumes saisis dans le formulaire.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Déclaration créée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Declaration'}
        default: {$ref: '#/components/responses/Error'}
  /declarations/quick/context:
    get:
      tags: [Declarations]
      operationId: getQuickDeclarationContext
      summary: Contexte de saisie rapide
      description: Retourne les points, usages et périodes utiles à la saisie rapide.
      responses:
        '200':
          description: Contexte disponible
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default: {$ref: '#/components/responses/Error'}
  /declarations/me:
    get:
      tags: [Declarations]
      operationId: listMyDeclarations
      summary: Lister mes déclarations
      description: Retourne les déclarations accessibles au déclarant connecté.
      responses:
        '200':
          description: Liste des déclarations
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Declaration'}
        default: {$ref: '#/components/responses/Error'}
  /declarations/me/telemetry-sources:
    get:
      tags: [Declarations]
      operationId: listMyTelemetrySources
      summary: Lister mes sources de télémétrie
      description: Retourne les sources API accessibles au déclarant connecté.
      responses:
        '200':
          description: Liste des sources
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Source'}
        default: {$ref: '#/components/responses/Error'}
  /declarations/allowed-types:
    get:
      tags: [Declarations]
      operationId: listMyAllowedDeclarationTypes
      summary: Types de déclaration autorisés
      description: Retourne les types de déclaration disponibles pour le déclarant connecté.
      responses:
        '200':
          description: Types autorisés
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /declarations/{declarationId}:
    get:
      tags: [Declarations]
      operationId: getDeclaration
      summary: Lire une déclaration
      description: Retourne le détail d'une déclaration accessible.
      parameters:
        - $ref: '#/components/parameters/DeclarationId'
      responses:
        '200':
          description: Déclaration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Declaration'}
        default: {$ref: '#/components/responses/Error'}
  /declarations/{declarationId}/available-points-prelevements:
    get:
      tags: [Declarations]
      operationId: getAvailablePointsPrelevementsForDeclaration
      summary: Points disponibles pour rapprochement
      description: Retourne les points utilisables pour rapprocher les lignes d'une déclaration.
      parameters:
        - $ref: '#/components/parameters/DeclarationId'
      responses:
        '200':
          description: Points disponibles
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PointPrelevement'}
        default: {$ref: '#/components/responses/Error'}
  /declarations/{declarationId}/chunks/{chunkId}/reconcile:
    post:
      tags: [Declarations]
      operationId: reconcileDeclarationChunk
      summary: Rapprocher une ligne de déclaration
      description: >-
        Associe une ligne non rapprochée à un point existant, ou modifie/retire
        une association réalisée manuellement. Une association issue du
        rapprochement automatique ne peut être ni remplacée ni retirée.
      parameters:
        - $ref: '#/components/parameters/DeclarationId'
        - $ref: '#/components/parameters/ChunkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pointPrelevementId]
              properties:
                pointPrelevementId:
                  description: Identifiant du point cible, ou `null` pour retirer une association manuelle.
                  oneOf:
                    - type: string
                      format: uuid
                    - type: 'null'
      responses:
        '200': {description: Rapprochement enregistré}
        '409':
          description: >-
            Association automatique verrouillée, type de point incompatible ou
            données déjà présentes sur une période chevauchante.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /admin/declarations/{declarationId}:
    delete:
      tags: [Declarations]
      operationId: deleteDeclaration
      summary: Supprimer une déclaration
      description: Supprime une déclaration et ses effets applicatifs.
      parameters:
        - $ref: '#/components/parameters/DeclarationId'
      responses:
        '204': {description: Déclaration supprimée}
        default: {$ref: '#/components/responses/Error'}
  /admin/declarations/{declarationId}/replay:
    post:
      tags: [Declarations]
      operationId: replayDeclaration
      summary: Rejouer une déclaration
      description: Remet une déclaration en file de traitement.
      parameters:
        - $ref: '#/components/parameters/DeclarationId'
      responses:
        '202': {description: Rejeu demandé}
        default: {$ref: '#/components/responses/Error'}
  /sources/me:
    get:
      tags: [Sources]
      operationId: listMySources
      summary: Lister les sources instructeur
      description: Retourne les sources visibles par l'instructeur connecté.
      responses:
        '200':
          description: Liste des sources
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Source'}
        default: {$ref: '#/components/responses/Error'}
  /sources/{sourceId}:
    get:
      tags: [Sources]
      operationId: getSource
      summary: Lire une source
      description: Retourne le détail d'une source accessible.
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          description: Source
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Source'}
        default: {$ref: '#/components/responses/Error'}
  /chunks/{chunkId}/instruction:
    post:
      tags: [Instruction]
      operationId: updateChunkInstruction
      summary: Mettre à jour l'instruction d'une ligne
      description: >-
        Enregistre l'état d'instruction d'une ligne de déclaration. Le point peut
        être choisi, remplacé ou retiré uniquement si l'association est absente
        ou a été réalisée manuellement. Une association automatique reste
        verrouillée, y compris pour un administrateur.
      parameters:
        - $ref: '#/components/parameters/ChunkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [instructionStatus]
              properties:
                instructionStatus:
                  type: string
                  enum: [PENDING, REJECTED, VALIDATED]
                instructionComment:
                  type: [string, 'null']
                pointPrelevementId:
                  description: Identifiant du point cible, ou `null` pour retirer une association manuelle.
                  oneOf:
                    - type: string
                      format: uuid
                    - type: 'null'
      responses:
        '200': {description: Instruction enregistrée}
        '409':
          description: >-
            Association automatique verrouillée, type de point incompatible ou
            données déjà présentes sur une période chevauchante.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /declarants/search:
    get:
      tags: [Declarants]
      operationId: searchDeclarants
      summary: Rechercher et paginer les déclarants accessibles
      description: >-
        Recherche accent-insensible, partielle et approximative dans le seul
        périmètre autorisé. GET /declarants conserve son ancien tableau complet.
      parameters:
        - $ref: '#/components/parameters/SearchPage'
        - $ref: '#/components/parameters/SearchPageSize'
        - $ref: '#/components/parameters/SearchFormat'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchRole'
        - $ref: '#/components/parameters/SearchDeclarantType'
        - $ref: '#/components/parameters/SearchPreleveurType'
        - $ref: '#/components/parameters/SearchEmailStatus'
        - $ref: '#/components/parameters/SearchCollecteurStatus'
        - $ref: '#/components/parameters/SearchConnectorStatus'
        - $ref: '#/components/parameters/SearchActivityRange'
        - $ref: '#/components/parameters/SearchZoneIds'
        - $ref: '#/components/parameters/SearchUsageCodes'
        - $ref: '#/components/parameters/SearchWaterBodyTypes'
        - $ref: '#/components/parameters/SearchExploitationStatuses'
        - $ref: '#/components/parameters/SearchSort'
        - $ref: '#/components/parameters/SearchOrder'
      responses:
        '200':
          description: Page de déclarants
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeclarantSearchResponse'}
        default: {$ref: '#/components/responses/Error'}
  /collecteurs/me/preleveurs/search:
    get:
      tags: [Declarants]
      operationId: searchMyCollecteurPreleveurs
      summary: Rechercher les préleveurs du collecteur connecté
      description: >-
        Recherche les identités et les points, alias, usages et codes des seules
        exploitations explicitement liées au collecteur connecté.
      parameters:
        - $ref: '#/components/parameters/SearchPage'
        - $ref: '#/components/parameters/SearchPageSize'
        - $ref: '#/components/parameters/SearchFormat'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchDeclarantType'
        - $ref: '#/components/parameters/SearchPreleveurType'
        - $ref: '#/components/parameters/SearchEmailStatus'
        - $ref: '#/components/parameters/SearchCollecteurStatus'
        - $ref: '#/components/parameters/SearchConnectorStatus'
        - $ref: '#/components/parameters/SearchActivityRange'
        - $ref: '#/components/parameters/SearchZoneIds'
        - $ref: '#/components/parameters/SearchUsageCodes'
        - $ref: '#/components/parameters/SearchWaterBodyTypes'
        - $ref: '#/components/parameters/SearchExploitationStatuses'
        - $ref: '#/components/parameters/SearchSort'
        - $ref: '#/components/parameters/SearchOrder'
      responses:
        '200':
          description: Page de préleveurs liés
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeclarantSearchResponse'}
        default: {$ref: '#/components/responses/Error'}
  /collecteurs/{collecteurId}/exploitations/candidates:
    get:
      tags: [Declarants]
      operationId: listCollecteurExploitationCandidates
      summary: Lister les exploitations associées ou disponibles pour un collecteur
      description: >-
        Réservé aux instructeurs et administrateurs. Les associations existantes
        sont limitées au droit exploitation.list. Les exploitations disponibles
        exigent les droits exploitation.list et exploitation.update sur le point,
        ainsi qu'au moins une zone du point partagée avec le collecteur. Les trois
        conditions peuvent être satisfaites par des zones différentes du point.
      parameters:
        - in: path
          name: collecteurId
          required: true
          schema: {$ref: '#/components/schemas/Uuid'}
        - in: query
          name: view
          required: true
          schema: {type: string, enum: [ASSOCIATED, AVAILABLE]}
        - in: query
          name: page
          schema: {type: integer, minimum: 1, default: 1}
        - in: query
          name: perPage
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - in: query
          name: query
          schema: {type: string, maxLength: 200}
        - in: query
          name: zoneIds
          description: UUID répétés ou séparés par des virgules.
          schema:
            type: array
            maxItems: 100
            items: {$ref: '#/components/schemas/Uuid'}
          style: form
          explode: true
        - in: query
          name: usageCodes
          description: Codes répétés ou séparés par des virgules.
          schema:
            type: array
            maxItems: 100
            items: {type: string, maxLength: 16}
          style: form
          explode: true
        - in: query
          name: statuses
          description: Statuts répétés ou séparés par des virgules.
          schema:
            type: array
            items:
              type: string
              enum: [EN_ACTIVITE, NON_RENSEIGNE, ABANDONNEE, TERMINEE]
          style: form
          explode: true
        - in: query
          name: preleveurId
          schema: {$ref: '#/components/schemas/Uuid'}
        - in: query
          name: sort
          schema:
            type: string
            enum: [RELEVANCE, POINT_ASC, POINT_DESC, PRELEVEUR_ASC, PRELEVEUR_DESC]
            default: RELEVANCE
        - in: query
          name: idsOnly
          description: >-
            Retourne au plus 2000 identifiants actionnables sur tout le résultat
            filtré, sans appliquer page ni perPage. Les associations en lecture
            seule sont exclues.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Candidats visibles dans le périmètre autorisé
          headers:
            ETag:
              description: Version des associations visibles et modifiables pour l'acteur, entre guillemets.
              schema: {type: string}
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/CollecteurExploitationCandidatePage'}
                  - {$ref: '#/components/schemas/CollecteurExploitationCandidateIds'}
        '422':
          description: Plus de 2000 identifiants actionnables correspondent aux filtres.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /collecteurs/{collecteurId}/exploitations:
    patch:
      tags: [Declarants]
      operationId: updateCollecteurExploitations
      summary: Ajouter et retirer en masse des exploitations d'un collecteur
      description: >-
        Réservé aux instructeurs et administrateurs. Les identifiants sont
        explicites et leur nombre cumulé est limité à 2000. L'opération est
        atomique et idempotente. If-Match est obligatoire dès qu'un retrait est
        demandé. Chaque identifiant exige exploitation.list et
        exploitation.update sur le point. Un retrait reste possible pour une
        association historique.
      parameters:
        - in: path
          name: collecteurId
          required: true
          schema: {$ref: '#/components/schemas/Uuid'}
        - in: header
          name: If-Match
          required: false
          description: Version renvoyée par ETag ou meta.associationVersion, brute ou entre guillemets.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CollecteurExploitationBulkRequest'}
      responses:
        '200':
          description: Différence appliquée dans une transaction unique
          headers:
            ETag:
              description: Nouvelle version des associations visibles et modifiables pour l'acteur.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollecteurExploitationBulkResponse'}
        '412':
          description: Version obsolète; aucune association n'a été modifiée.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssociationPreconditionError'}
        '428':
          description: If-Match est absent alors qu'au moins un retrait est demandé.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        default: {$ref: '#/components/responses/Error'}
  /zones/{zoneId}/points-prelevement:
    get:
      tags: [Zones]
      operationId: searchZonePointsPrelevement
      summary: Rechercher les points d’une zone
      description: Les filtres et facettes croisés sont omis sans les droits de zone correspondants.
      parameters:
        - $ref: '#/components/parameters/ZoneId'
        - $ref: '#/components/parameters/SearchPage'
        - $ref: '#/components/parameters/SearchPerPage'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchPreleveurTypes'
        - $ref: '#/components/parameters/SearchFlowTypes'
        - $ref: '#/components/parameters/SearchWaterBodyTypes'
        - $ref: '#/components/parameters/SearchUsageCodes'
        - $ref: '#/components/parameters/SearchExploitationStatuses'
        - $ref: '#/components/parameters/SearchCollecteurStatus'
        - $ref: '#/components/parameters/SearchConnectorStatus'
        - $ref: '#/components/parameters/ZoneSearchSort'
        - $ref: '#/components/parameters/SearchOrder'
      responses:
        '200':
          description: Page de points
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ZoneSearchResponse'}
        default: {$ref: '#/components/responses/Error'}
  /zones/{zoneId}/exploitations:
    get:
      tags: [Zones]
      operationId: searchZoneExploitations
      summary: Rechercher les exploitations d’une zone
      description: Applique recherche intelligente, filtres métier, facettes et tri stable.
      parameters:
        - $ref: '#/components/parameters/ZoneId'
        - $ref: '#/components/parameters/SearchPage'
        - $ref: '#/components/parameters/SearchPerPage'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchDeclarantType'
        - $ref: '#/components/parameters/SearchPreleveurTypes'
        - $ref: '#/components/parameters/SearchEmailStatus'
        - $ref: '#/components/parameters/SearchActivityRange'
        - $ref: '#/components/parameters/SearchFlowTypes'
        - $ref: '#/components/parameters/SearchWaterBodyTypes'
        - $ref: '#/components/parameters/SearchUsageCodes'
        - $ref: '#/components/parameters/SearchExploitationStatuses'
        - $ref: '#/components/parameters/SearchCollecteurStatus'
        - $ref: '#/components/parameters/SearchConnectorStatus'
        - $ref: '#/components/parameters/ZoneSearchSort'
        - $ref: '#/components/parameters/SearchOrder'
      responses:
        '200':
          description: Page d’exploitations
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ZoneSearchResponse'}
        default: {$ref: '#/components/responses/Error'}
  /zones/{zoneId}/declarants:
    get:
      tags: [Zones]
      operationId: searchZoneDeclarants
      summary: Rechercher les déclarants d’une zone
      description: Les relations et facettes d’exploitation sont omises sans exploitation.list.
      parameters:
        - $ref: '#/components/parameters/ZoneId'
        - $ref: '#/components/parameters/SearchPage'
        - $ref: '#/components/parameters/SearchPerPage'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchRole'
        - $ref: '#/components/parameters/SearchDeclarantType'
        - $ref: '#/components/parameters/SearchPreleveurTypes'
        - $ref: '#/components/parameters/SearchEmailStatus'
        - $ref: '#/components/parameters/SearchActivityRange'
        - $ref: '#/components/parameters/SearchWaterBodyTypes'
        - $ref: '#/components/parameters/SearchUsageCodes'
        - $ref: '#/components/parameters/SearchExploitationStatuses'
        - $ref: '#/components/parameters/SearchCollecteurStatus'
        - $ref: '#/components/parameters/SearchConnectorStatus'
        - $ref: '#/components/parameters/ZoneSearchSort'
        - $ref: '#/components/parameters/SearchOrder'
      responses:
        '200':
          description: Page de déclarants
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ZoneSearchResponse'}
        default: {$ref: '#/components/responses/Error'}
  /zones/{zoneId}/collecteurs:
    get:
      tags: [Zones]
      operationId: searchZoneCollecteurs
      summary: Rechercher les collecteurs d’une zone
      description: Variante de la liste des déclarants dont le rôle est fixé à COLLECTEUR.
      parameters:
        - $ref: '#/components/parameters/ZoneId'
        - $ref: '#/components/parameters/SearchPage'
        - $ref: '#/components/parameters/SearchPerPage'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SearchDeclarantType'
        - $ref: '#/components/parameters/SearchEmailStatus'
        - $ref: '#/components/parameters/SearchActivityRange'
        - $ref: '#/components/parameters/SearchWaterBodyTypes'
        - $ref: '#/components/parameters/SearchUsageCodes'
        - $ref: '#/components/parameters/SearchExploitationStatuses'
        - $ref: '#/components/parameters/SearchConnectorStatus'
        - $ref: '#/components/parameters/ZoneSearchSort'
        - $ref: '#/components/parameters/SearchOrder'
      responses:
        '200':
          description: Page de collecteurs
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ZoneSearchResponse'}
        default: {$ref: '#/components/responses/Error'}
  /declarants/{declarantId}/overview:
    get:
      tags: [Declarants]
      operationId: getDeclarantOverview
      summary: Lire le résumé léger d’un déclarant
      description: Retourne les données nécessaires à la fiche sans les connecteurs, documents et zones imbriqués des exploitations.
      parameters:
        - $ref: '#/components/parameters/DeclarantId'
      responses:
        '200':
          description: Résumé du déclarant
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeclarantOverview'}
        default: {$ref: '#/components/responses/Error'}
  /preleveurs/{declarantId}/points-prelevement:
    get:
      tags: [Instruction]
      operationId: getPreleveurPointsPrelevement
      summary: Points d'un déclarant
      description: Retourne les points de prélèvement associés à un déclarant.
      parameters:
        - $ref: '#/components/parameters/DeclarantId'
      responses:
        '200':
          description: Points
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PointPrelevement'}
        default: {$ref: '#/components/responses/Error'}
  /preleveurs/{declarantId}/exploitations:
    get:
      tags: [Instruction]
      operationId: getPreleveurExploitations
      summary: Exploitations d'un déclarant
      description: Retourne les exploitations associées à un déclarant.
      parameters:
        - $ref: '#/components/parameters/DeclarantId'
      responses:
        '200':
          description: Exploitations
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Exploitation'}
        default: {$ref: '#/components/responses/Error'}
  /points-prelevement/{pointId}/usage-name:
    patch:
      tags: [Instruction]
      operationId: updatePointUsageName
      summary: Modifier le nom d'usage d'un point
      description: Permet à un déclarant rattaché activement au point de définir ou supprimer son nom d'usage partagé.
      parameters:
        - $ref: '#/components/parameters/PointId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [usageName]
              properties:
                usageName:
                  type: [string, 'null']
                  maxLength: 200
      responses:
        '200':
          description: Point mis à jour
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PointPrelevement'}
        default: {$ref: '#/components/responses/Error'}
  /points-prelevement/{pointId}/exploitations:
    get:
      tags: [Instruction]
      operationId: getPointExploitations
      summary: Exploitations d'un point
      description: Retourne les exploitations associées à un point de prélèvement.
      parameters:
        - $ref: '#/components/parameters/PointId'
      responses:
        '200':
          description: Exploitations
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Exploitation'}
        default: {$ref: '#/components/responses/Error'}
  /referentiels/usages-eau:
    get:
      tags: [Referentiels]
      operationId: getWaterUses
      summary: Lister les usages de l'eau
      description: Retourne le référentiel SANDRE des usages de l'eau.
      responses:
        '200':
          description: Usages
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/WaterUse'}
        default: {$ref: '#/components/responses/Error'}
  /stats:
    get:
      tags: [Stats]
      operationId: getStats
      summary: Statistiques publiques
      description: Retourne les statistiques agrégées affichées par le front.
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default: {$ref: '#/components/responses/Error'}
  /admin/dashboard:
    get:
      tags: [Administration]
      operationId: getAdminDashboard
      summary: Lire le cockpit opérationnel d'administration
      description: >-
        Retourne l'activité sur une période et l'état opérationnel actuel réservés aux administrateurs.
        Les deux dates sont incluses, doivent être renseignées ensemble, ne peuvent pas être futures et couvrent
        au maximum 366 jours.
      parameters:
        - in: query
          name: startDate
          description: Premier jour inclus. Le début du mois en cours est utilisé si les deux dates sont absentes.
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          description: Dernier jour inclus. La date courante est utilisée si les deux dates sont absentes.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Indicateurs du cockpit d'administration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminDashboardResponse'}
        default: {$ref: '#/components/responses/Error'}
  /admin/audit-events:
    get:
      tags: [Administration]
      operationId: listAuditEvents
      summary: Consulter le journal d'audit de sécurité
      description: >-
        Retourne les actions sensibles accessibles aux administrateurs globaux. La consultation est elle-même
        auditée, mais l'événement courant n'est visible qu'à partir de la requête suivante.
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 1, default: 1}
        - in: query
          name: pageSize
          schema: {type: integer, enum: [25, 50, 100], default: 25}
        - in: query
          name: actor
          description: Recherche sur le nom, l'email ou l'identifiant de l'auteur réel.
          schema: {type: string, maxLength: 200}
        - in: query
          name: subject
          description: Recherche sur le compte effectif ou explicitement concerné.
          schema: {type: string, maxLength: 200}
        - in: query
          name: target
          description: Recherche sur le libellé ou l'identifiant de la ressource modifiée.
          schema: {type: string, maxLength: 200}
        - in: query
          name: from
          description: Premier jour inclus, interprété dans le fuseau Europe/Paris.
          schema: {type: string, format: date}
        - in: query
          name: to
          description: Dernier jour inclus, interprété dans le fuseau Europe/Paris.
          schema: {type: string, format: date}
        - in: query
          name: period
          description: Période glissante remplaçant les bornes from et to.
          schema: {type: string, enum: [24h, all]}
        - in: query
          name: actionTypes
          description: Codes d'action séparés par des virgules.
          schema: {type: string}
        - in: query
          name: outcomes
          description: Résultats séparés par des virgules.
          schema: {type: string}
      responses:
        '200':
          description: Page d'événements d'audit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventsResponse'}
        default: {$ref: '#/components/responses/Error'}
  /admin/audit-events/options:
    get:
      tags: [Administration]
      operationId: getAuditEventFilterOptions
      summary: Lister les filtres du journal d'audit
      description: Retourne le catalogue des actions et des résultats utilisables dans l'interface d'administration.
      responses:
        '200':
          description: Types d'action regroupés et résultats disponibles
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventOptionsResponse'}
        default: {$ref: '#/components/responses/Error'}
  /admin/audit-events/{eventId}:
    get:
      tags: [Administration]
      operationId: getAuditEventDetail
      summary: Consulter le détail d'un événement d'audit
      description: Retourne l'événement et les mutations métier associées. Réservé aux administrateurs globaux.
      parameters:
        - in: path
          name: eventId
          required: true
          schema: {$ref: '#/components/schemas/Uuid'}
      responses:
        '200':
          description: Événement d'audit détaillé
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventDetailResponse'}
        default: {$ref: '#/components/responses/Error'}
  /audit-history/{resourceType}/{resourceId}:
    get:
      tags: [Administration]
      operationId: listResourceAuditHistory
      summary: Consulter l'historique des modifications d'une ressource
      description: >-
        Retourne les mutations visibles par un administrateur global ou par un agent disposant du droit de
        modification correspondant. Les déclarants et collecteurs n'ont pas accès à cet historique.
      parameters:
        - in: path
          name: resourceType
          required: true
          schema:
            type: string
            enum: [POINT, DECLARANT, EXPLOITATION, ZONE]
        - in: path
          name: resourceId
          required: true
          schema: {$ref: '#/components/schemas/Uuid'}
        - in: query
          name: page
          schema: {type: integer, minimum: 1, default: 1}
        - in: query
          name: pageSize
          schema: {type: integer, minimum: 1, maximum: 50, default: 10}
      responses:
        '200':
          description: Page de mutations de la ressource
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceAuditHistoryResponse'}
        default: {$ref: '#/components/responses/Error'}
  /dashboard/water-resources/piezometry:
    get:
      tags: [Dashboard]
      operationId: getDashboardPiezometry
      summary: Lire les niveaux piézométriques du tableau de bord
      description: Retourne les observations mises en cache pour les piézomètres actifs des zones accessibles et sélectionnées.
      parameters:
        - $ref: '#/components/parameters/DashboardZones'
        - in: query
          name: period
          schema:
            type: string
            enum: [week, month, year, five-years, ten-years, twenty-years]
            default: week
        - in: query
          name: includeIps
          description: Calcule l'indicateur piézométrique standardisé mensuel à partir de l'historique validé.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Niveaux piézométriques par station
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardWaterResources'}
        default: {$ref: '#/components/responses/Error'}
  /dashboard/water-resources/flows:
    get:
      tags: [Dashboard]
      operationId: getDashboardRiverFlows
      summary: Lire les débits du tableau de bord
      description: Retourne les observations mises en cache pour les stations hydrométriques actives des zones accessibles et sélectionnées.
      parameters:
        - $ref: '#/components/parameters/DashboardZones'
        - in: query
          name: period
          schema:
            type: string
            enum: [week, month, year]
            default: week
      responses:
        '200':
          description: Débits par station
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardWaterResources'}
        default: {$ref: '#/components/responses/Error'}
  /zones/{zoneId}/monitoring-stations:
    get:
      tags: [Zones]
      operationId: listZoneMonitoringStations
      summary: Lister les stations de mesure d'une zone
      description: Retourne le paramétrage visible par l'agent pour la zone, y compris les ressources désactivées et leur état de synchronisation.
      parameters:
        - $ref: '#/components/parameters/ZoneId'
      responses:
        '200':
          description: Stations configurées, actives ou inactives
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ZoneMonitoringStation'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Zones]
      operationId: createZoneMonitoringStation
      summary: Ajouter une station de mesure à une zone
      description: Réservé aux administrateurs globaux et aux administrateurs de la zone. Le code est validé auprès de Hub'Eau avant enregistrement.
      parameters:
        - $ref: '#/components/parameters/ZoneId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ZoneMonitoringStationInput'}
      responses:
        '201':
          description: Station ajoutée et synchronisation programmée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ZoneMonitoringStation'}
        '409': {description: Station déjà configurée pour la zone}
        '422': {description: Code station inconnu de Hub'Eau}
        default: {$ref: '#/components/responses/Error'}
  /zones/{zoneId}/monitoring-stations/{associationId}:
    patch:
      tags: [Zones]
      operationId: updateZoneMonitoringStation
      summary: Modifier une station de mesure d'une zone
      description: Réservé aux administrateurs globaux et aux administrateurs de la zone.
      parameters:
        - $ref: '#/components/parameters/ZoneId'
        - $ref: '#/components/parameters/MonitoringStationAssociationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ZoneMonitoringStationInput'}
      responses:
        '200':
          description: Station modifiée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ZoneMonitoringStation'}
        '409': {description: Station déjà configurée pour la zone}
        '422': {description: Code station inconnu de Hub'Eau}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Zones]
      operationId: deleteZoneMonitoringStation
      summary: Retirer une station de mesure d'une zone
      description: Réservé aux administrateurs globaux et aux administrateurs de la zone.
      parameters:
        - $ref: '#/components/parameters/ZoneId'
        - $ref: '#/components/parameters/MonitoringStationAssociationId'
      responses:
        '204': {description: Station retirée de la zone}
        default: {$ref: '#/components/responses/Error'}
  /series:
    get:
      tags: [Series]
      operationId: listSeries
      summary: Rechercher des séries
      description: Liste les métadonnées de séries accessibles à l'instructeur.
      parameters:
        - in: query
          name: pointIds
          schema: {type: string}
          description: Liste d'UUID de points séparés par des virgules.
        - in: query
          name: preleveurId
          schema: {type: string, format: uuid}
        - in: query
          name: sourceId
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Séries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SeriesMetadata'}
        default: {$ref: '#/components/responses/Error'}
  /series/{seriesId}:
    get:
      tags: [Series]
      operationId: getSeries
      summary: Lire une série
      description: Retourne les métadonnées d'une série.
      parameters:
        - $ref: '#/components/parameters/SeriesId'
      responses:
        '200':
          description: Série
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SeriesMetadata'}
        default: {$ref: '#/components/responses/Error'}
  /series/{seriesId}/values:
    get:
      tags: [Series]
      operationId: getSeriesValues
      summary: Lire les valeurs d'une série
      description: Retourne les valeurs temporelles d'une série.
      parameters:
        - $ref: '#/components/parameters/SeriesId'
      responses:
        '200':
          description: Valeurs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SeriesValue'}
        default: {$ref: '#/components/responses/Error'}
  /aggregated-series:
    get:
      tags: [Series]
      operationId: getAggregatedSeries
      summary: Agréger des séries
      description: >-
        Agrège les valeurs de séries sur un périmètre UUID. Les cumuls sont répartis
        uniformément sur leur période source semi-ouverte avant l'agrégation demandée ;
        cette transformation sert uniquement à l'affichage.
      parameters:
        - in: query
          name: metricTypeCode
          required: true
          description: Type de mesure (`volume`, `index`, `débit`, etc.), indépendamment du type de point.
          schema: {type: string}
        - in: query
          name: pointFlowType
          description: Filtre optionnel sur le type de point pour distinguer prélèvements et rejets d'un même type de mesure.
          schema:
            type: string
            enum: [PRELEVEMENT, REJET]
        - in: query
          name: startDate
          schema: {type: string, format: date}
        - in: query
          name: endDate
          description: Dernier jour inclus dans la fenêtre demandée.
          schema: {type: string, format: date}
        - in: query
          name: aggregationFrequency
          description: Résolution temporelle de la série retournée.
          schema:
            type: string
            default: 1 day
            enum: [15 minutes, 1 hour, 6 hours, 1 day, 1 week, 1 month, 1 quarter, 1 year]
        - in: query
          name: spatialOperator
          schema:
            type: string
            enum: [sum, mean, min, max]
        - in: query
          name: temporalOperator
          schema:
            type: string
            enum: [sum, mean, min, max]
        - in: query
          name: pointIds
          schema: {type: string}
        - in: query
          name: preleveurId
          schema: {type: string, format: uuid}
        - in: query
          name: collecteurId
          schema: {type: string, format: uuid}
        - in: query
          name: sourceId
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Série agrégée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregatedSeriesResponse'
        default: {$ref: '#/components/responses/Error'}
  /aggregated-series/options:
    get:
      tags: [Series]
      operationId: getAggregatedSeriesOptions
      summary: Options d'agrégation
      description: Retourne les métriques et opérateurs disponibles sur un périmètre.
      parameters:
        - in: query
          name: pointIds
          schema: {type: string}
        - in: query
          name: preleveurId
          schema: {type: string, format: uuid}
        - in: query
          name: collecteurId
          schema: {type: string, format: uuid}
        - in: query
          name: sourceId
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Options disponibles
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default: {$ref: '#/components/responses/Error'}
components:
  parameters:
    DeclarationId:
      in: path
      name: declarationId
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    ChunkId:
      in: path
      name: chunkId
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    SourceId:
      in: path
      name: sourceId
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    DeclarantId:
      in: path
      name: declarantId
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    PointId:
      in: path
      name: pointId
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    SeriesId:
      in: path
      name: seriesId
      required: true
      schema:
        type: string
        description: Identifiant technique de série.
    ZoneId:
      in: path
      name: zoneId
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    SearchPage:
      in: query
      name: page
      description: Numéro de page, à partir de 1.
      schema: {type: integer, minimum: 1, default: 1}
    SearchPageSize:
      in: query
      name: pageSize
      description: Taille de page des recherches globales.
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    SearchFormat:
      in: query
      name: format
      description: >-
        `compact` retourne uniquement les champs nécessaires aux listes. En son
        absence, le format historique complet reste inchangé.
      schema: {type: string, enum: [compact]}
    SearchPerPage:
      in: query
      name: perPage
      description: Taille de page des listes de zone.
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    SearchQuery:
      in: query
      name: query
      description: Termes partiels, sans distinction de casse ou d’accent.
      schema: {type: string, maxLength: 200}
    SearchRole:
      in: query
      name: role
      schema: {type: string, enum: [PRELEVEUR, COLLECTEUR]}
    SearchDeclarantType:
      in: query
      name: declarantType
      schema: {type: string, enum: [NATURAL_PERSON, LEGAL_PERSON]}
    SearchPreleveurType:
      in: query
      name: preleveurType
      schema: {$ref: '#/components/schemas/PreleveurType'}
    SearchPreleveurTypes:
      in: query
      name: preleveurTypes
      style: form
      explode: true
      schema:
        type: array
        items: {$ref: '#/components/schemas/PreleveurType'}
    SearchEmailStatus:
      in: query
      name: emailStatus
      schema: {type: string, enum: [WITH_EMAIL, WITHOUT_EMAIL]}
    SearchCollecteurStatus:
      in: query
      name: collecteurStatus
      schema: {type: string, enum: [WITH_COLLECTEUR, WITHOUT_COLLECTEUR]}
    SearchConnectorStatus:
      in: query
      name: connectorStatus
      schema: {type: string, enum: [WITH_CONNECTOR, WITHOUT_CONNECTOR]}
    SearchActivityRange:
      in: query
      name: activityRange
      schema:
        type: string
        enum: [NEVER, LT_30_DAYS, DAYS_30_90, DAYS_91_365, GT_365_DAYS]
    SearchZoneIds:
      in: query
      name: zoneIds
      style: form
      explode: true
      schema:
        type: array
        items: {$ref: '#/components/schemas/Uuid'}
    SearchUsageCodes:
      in: query
      name: usageCodes
      style: form
      explode: true
      schema:
        type: array
        items: {type: string}
    SearchWaterBodyTypes:
      in: query
      name: waterBodyTypes
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum: [SUPERFICIELLE, SOUTERRAIN, TRANSITION]
    SearchFlowTypes:
      in: query
      name: flowTypes
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum: [PRELEVEMENT, REJET]
    SearchExploitationStatuses:
      in: query
      name: exploitationStatuses
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum: [EN_ACTIVITE, NON_RENSEIGNE, ABANDONNEE, TERMINEE]
    SearchSort:
      in: query
      name: sort
      schema:
        type: string
        enum: [RELEVANCE, NAME, LAST_DECLARATION]
        default: RELEVANCE
    ZoneSearchSort:
      in: query
      name: sort
      schema:
        type: string
        enum: [RELEVANCE, NAME, LAST_DECLARATION, CREATED_AT]
        default: RELEVANCE
    SearchOrder:
      in: query
      name: order
      description: Ordre du tri LAST_DECLARATION; les valeurs nulles restent à la fin.
      schema:
        type: string
        enum: [ASC, DESC]
        default: DESC
    MonitoringStationAssociationId:
      in: path
      name: associationId
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    DashboardZones:
      in: query
      name: zones
      schema: {type: string}
      description: Codes des zones accessibles séparés par des virgules. Toutes les zones accessibles sont utilisées si le paramètre est absent.
  responses:
    Error:
      description: Erreur
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Uuid:
      type: string
      format: uuid
    Error:
      type: object
      required: [message]
      properties:
        message: {type: string}
        code: {type: string}
        details: {}
    AssociationVersion:
      type: string
      pattern: '^[a-f0-9]{64}$'
    AssociationPreconditionError:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, const: 412}
        message: {type: string}
        data:
          type: object
          additionalProperties: false
          required: [latestAssociationVersion]
          properties:
            latestAssociationVersion: {$ref: '#/components/schemas/AssociationVersion'}
    CollecteurExploitationCandidate:
      type: object
      additionalProperties: false
      required: [id, status, startDate, endDate, isAssociated, canAdd, canRemove, readOnlyReason, point, preleveur, usage, zones]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        status:
          type: string
          enum: [EN_ACTIVITE, NON_RENSEIGNE, ABANDONNEE, TERMINEE]
        startDate: {type: [string, 'null'], format: date-time}
        endDate: {type: [string, 'null'], format: date-time}
        isAssociated: {type: boolean}
        canAdd: {type: boolean}
        canRemove: {type: boolean}
        readOnlyReason: {type: [string, 'null']}
        point:
          type: object
          additionalProperties: false
          required: [id, name, codeBSS, communeName]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            name: {type: string}
            codeBSS: {type: [string, 'null']}
            communeName: {type: [string, 'null']}
        preleveur:
          type: object
          additionalProperties: false
          required: [id, label]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            label: {type: string}
        usage:
          oneOf:
            - type: object
              additionalProperties: false
              required: [code, label]
              properties:
                code: {type: string}
                label: {type: string}
            - type: 'null'
        zones:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, code, name]
            properties:
              id: {$ref: '#/components/schemas/Uuid'}
              code: {type: string}
              name: {type: string}
    CollecteurExploitationFacetValues:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [value, label, count]
        properties:
          value: {type: string}
          label: {type: string}
          count: {type: integer, minimum: 1}
    CollecteurExploitationMeta:
      type: object
