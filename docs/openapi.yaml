openapi: 3.1.0
info:
  title: Prélèvements d'eau API
  version: 1.0.0
  description: API HTTP de Partageons l'eau pour les déclarations, référentiels, séries temporelles et imports.
servers:
  - url: http://localhost:5000/api
    description: Local
tags:
  - name: Auth
  - name: Dashboard
  - name: Declarations
  - name: Sources
  - name: Instruction
  - name: Referentiels
  - name: Series
  - name: Stats
  - name: Zones
paths:
  /auth/request:
    post:
      tags: [Auth]
      operationId: requestAuth
      summary: Demander un lien de connexion
      description: Envoie un jeton de connexion à l'adresse email fournie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '204': {description: Demande acceptée}
        default: {$ref: '#/components/responses/Error'}
  /auth/verify:
    post:
      tags: [Auth]
      operationId: verifyAuthToken
      summary: Vérifier un jeton de connexion
      description: Crée une session à partir d'un jeton d'authentification valide.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '200':
          description: Session créée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSession'}
        default: {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Fermer la session
      description: Supprime la session courante.
      responses:
        '204': {description: Session supprimée}
        default: {$ref: '#/components/responses/Error'}
  /info:
    get:
      tags: [Auth]
      operationId: getInfo
      summary: Lire la session courante
      description: Retourne l'utilisateur authentifié et ses rôles.
      responses:
        '200':
          description: Informations de session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSession'}
        default: {$ref: '#/components/responses/Error'}
  /declarations:
    post:
      tags: [Declarations]
      operationId: createDeclaration
      summary: Créer une déclaration avec fichiers
      description: Crée une déclaration déposée par un déclarant et stocke les fichiers associés.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Déclaration créée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Declaration'}
        default: {$ref: '#/components/responses/Error'}
  /declarations/quick:
    post:
      tags: [Declarations]
      operationId: createQuickDeclaration
      summary: Créer une saisie rapide
      description: Crée une déclaration rapide depuis des index ou volumes saisis dans le formulaire.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Déclaration créée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Declaration'}
        default: {$ref: '#/components/responses/Error'}
  /declarations/quick/context:
    get:
      tags: [Declarations]
      operationId: getQuickDeclarationContext
      summary: Contexte de saisie rapide
      description: Retourne les points, usages et périodes utiles à la saisie rapide.
      responses:
        '200':
          description: Contexte disponible
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default: {$ref: '#/components/responses/Error'}
  /declarations/me:
    get:
      tags: [Declarations]
      operationId: listMyDeclarations
      summary: Lister mes déclarations
      description: Retourne les déclarations accessibles au déclarant connecté.
      responses:
        '200':
          description: Liste des déclarations
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Declaration'}
        default: {$ref: '#/components/responses/Error'}
  /declarations/me/telemetry-sources:
    get:
      tags: [Declarations]
      operationId: listMyTelemetrySources
      summary: Lister mes sources de télémétrie
      description: Retourne les sources API accessibles au déclarant connecté.
      responses:
        '200':
          description: Liste des sources
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Source'}
        default: {$ref: '#/components/responses/Error'}
  /declarations/allowed-types:
    get:
      tags: [Declarations]
      operationId: listMyAllowedDeclarationTypes
      summary: Types de déclaration autorisés
      description: Retourne les types de déclaration disponibles pour le déclarant connecté.
      responses:
        '200':
          description: Types autorisés
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /declarations/{declarationId}:
    get:
      tags: [Declarations]
      operationId: getDeclaration
      summary: Lire une déclaration
      description: Retourne le détail d'une déclaration accessible.
      parameters:
        - $ref: '#/components/parameters/DeclarationId'
      responses:
        '200':
          description: Déclaration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Declaration'}
        default: {$ref: '#/components/responses/Error'}
  /declarations/{declarationId}/available-points-prelevements:
    get:
      tags: [Declarations]
      operationId: getAvailablePointsPrelevementsForDeclaration
      summary: Points disponibles pour rapprochement
      description: Retourne les points utilisables pour rapprocher les lignes d'une déclaration.
      parameters:
        - $ref: '#/components/parameters/DeclarationId'
      responses:
        '200':
          description: Points disponibles
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PointPrelevement'}
        default: {$ref: '#/components/responses/Error'}
  /declarations/{declarationId}/chunks/{chunkId}/reconcile:
    post:
      tags: [Declarations]
      operationId: reconcileDeclarationChunk
      summary: Rapprocher une ligne de déclaration
      description: Associe une ligne de déclaration à un point existant.
      parameters:
        - $ref: '#/components/parameters/DeclarationId'
        - $ref: '#/components/parameters/ChunkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': {description: Rapprochement enregistré}
        default: {$ref: '#/components/responses/Error'}
  /admin/declarations/{declarationId}:
    delete:
      tags: [Declarations]
      operationId: deleteDeclaration
      summary: Supprimer une déclaration
      description: Supprime une déclaration et ses effets applicatifs.
      parameters:
        - $ref: '#/components/parameters/DeclarationId'
      responses:
        '204': {description: Déclaration supprimée}
        default: {$ref: '#/components/responses/Error'}
  /admin/declarations/{declarationId}/replay:
    post:
      tags: [Declarations]
      operationId: replayDeclaration
      summary: Rejouer une déclaration
      description: Remet une déclaration en file de traitement.
      parameters:
        - $ref: '#/components/parameters/DeclarationId'
      responses:
        '202': {description: Rejeu demandé}
        default: {$ref: '#/components/responses/Error'}
  /sources/me:
    get:
      tags: [Sources]
      operationId: listMySources
      summary: Lister les sources instructeur
      description: Retourne les sources visibles par l'instructeur connecté.
      responses:
        '200':
          description: Liste des sources
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Source'}
        default: {$ref: '#/components/responses/Error'}
  /sources/{sourceId}:
    get:
      tags: [Sources]
      operationId: getSource
      summary: Lire une source
      description: Retourne le détail d'une source accessible.
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          description: Source
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Source'}
        default: {$ref: '#/components/responses/Error'}
  /chunks/{chunkId}/instruction:
    post:
      tags: [Instruction]
      operationId: updateChunkInstruction
      summary: Mettre à jour l'instruction d'une ligne
      description: Enregistre l'état d'instruction d'une ligne de déclaration.
      parameters:
        - $ref: '#/components/parameters/ChunkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': {description: Instruction enregistrée}
        default: {$ref: '#/components/responses/Error'}
  /preleveurs/{declarantId}/points-prelevement:
    get:
      tags: [Instruction]
      operationId: getPreleveurPointsPrelevement
      summary: Points d'un déclarant
      description: Retourne les points de prélèvement associés à un déclarant.
      parameters:
        - $ref: '#/components/parameters/DeclarantId'
      responses:
        '200':
          description: Points
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PointPrelevement'}
        default: {$ref: '#/components/responses/Error'}
  /preleveurs/{declarantId}/exploitations:
    get:
      tags: [Instruction]
      operationId: getPreleveurExploitations
      summary: Exploitations d'un déclarant
      description: Retourne les exploitations associées à un déclarant.
      parameters:
        - $ref: '#/components/parameters/DeclarantId'
      responses:
        '200':
          description: Exploitations
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Exploitation'}
        default: {$ref: '#/components/responses/Error'}
  /points-prelevement/{pointId}/exploitations:
    get:
      tags: [Instruction]
      operationId: getPointExploitations
      summary: Exploitations d'un point
      description: Retourne les exploitations associées à un point de prélèvement.
      parameters:
        - $ref: '#/components/parameters/PointId'
      responses:
        '200':
          description: Exploitations
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Exploitation'}
        default: {$ref: '#/components/responses/Error'}
  /referentiels/usages-eau:
    get:
      tags: [Referentiels]
      operationId: getWaterUses
      summary: Lister les usages de l'eau
      description: Retourne le référentiel SANDRE des usages de l'eau.
      responses:
        '200':
          description: Usages
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/WaterUse'}
        default: {$ref: '#/components/responses/Error'}
  /stats:
    get:
      tags: [Stats]
      operationId: getStats
      summary: Statistiques publiques
      description: Retourne les statistiques agrégées affichées par le front.
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default: {$ref: '#/components/responses/Error'}
  /dashboard/water-resources/piezometry:
    get:
      tags: [Dashboard]
      operationId: getDashboardPiezometry
      summary: Lire les niveaux piézométriques du tableau de bord
      description: Retourne les observations mises en cache pour les piézomètres actifs des zones accessibles et sélectionnées.
      parameters:
        - $ref: '#/components/parameters/DashboardZones'
        - in: query
          name: period
          schema:
            type: string
            enum: [week, month, year, twenty-years]
            default: week
      responses:
        '200':
          description: Niveaux piézométriques par station
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardWaterResources'}
        default: {$ref: '#/components/responses/Error'}
  /dashboard/water-resources/flows:
    get:
      tags: [Dashboard]
      operationId: getDashboardRiverFlows
      summary: Lire les débits du tableau de bord
      description: Retourne les observations mises en cache pour les stations hydrométriques actives des zones accessibles et sélectionnées.
      parameters:
        - $ref: '#/components/parameters/DashboardZones'
        - in: query
          name: period
          schema:
            type: string
            enum: [week, month, year]
            default: week
      responses:
        '200':
          description: Débits par station
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardWaterResources'}
        default: {$ref: '#/components/responses/Error'}
  /zones/{zoneId}/monitoring-stations:
    get:
      tags: [Zones]
      operationId: listZoneMonitoringStations
      summary: Lister les stations de mesure d'une zone
      description: Retourne le paramétrage visible par l'agent pour la zone, y compris les ressources désactivées et leur état de synchronisation.
      parameters:
        - $ref: '#/components/parameters/ZoneId'
      responses:
        '200':
          description: Stations configurées, actives ou inactives
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ZoneMonitoringStation'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Zones]
      operationId: createZoneMonitoringStation
      summary: Ajouter une station de mesure à une zone
      description: Réservé aux administrateurs globaux et aux administrateurs de la zone. Le code est validé auprès de Hub'Eau avant enregistrement.
      parameters:
        - $ref: '#/components/parameters/ZoneId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ZoneMonitoringStationInput'}
      responses:
        '201':
          description: Station ajoutée et synchronisation programmée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ZoneMonitoringStation'}
        '409': {description: Station déjà configurée pour la zone}
        '422': {description: Code station inconnu de Hub'Eau}
        default: {$ref: '#/components/responses/Error'}
  /zones/{zoneId}/monitoring-stations/{associationId}:
    patch:
      tags: [Zones]
      operationId: updateZoneMonitoringStation
      summary: Modifier une station de mesure d'une zone
      description: Réservé aux administrateurs globaux et aux administrateurs de la zone.
      parameters:
        - $ref: '#/components/parameters/ZoneId'
        - $ref: '#/components/parameters/MonitoringStationAssociationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ZoneMonitoringStationInput'}
      responses:
        '200':
          description: Station modifiée
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ZoneMonitoringStation'}
        '409': {description: Station déjà configurée pour la zone}
        '422': {description: Code station inconnu de Hub'Eau}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Zones]
      operationId: deleteZoneMonitoringStation
      summary: Retirer une station de mesure d'une zone
      description: Réservé aux administrateurs globaux et aux administrateurs de la zone.
      parameters:
        - $ref: '#/components/parameters/ZoneId'
        - $ref: '#/components/parameters/MonitoringStationAssociationId'
      responses:
        '204': {description: Station retirée de la zone}
        default: {$ref: '#/components/responses/Error'}
  /series:
    get:
      tags: [Series]
      operationId: listSeries
      summary: Rechercher des séries
      description: Liste les métadonnées de séries accessibles à l'instructeur.
      parameters:
        - in: query
          name: pointIds
          schema: {type: string}
          description: Liste d'UUID de points séparés par des virgules.
        - in: query
          name: preleveurId
          schema: {type: string, format: uuid}
        - in: query
          name: sourceId
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Séries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SeriesMetadata'}
        default: {$ref: '#/components/responses/Error'}
  /series/{seriesId}:
    get:
      tags: [Series]
      operationId: getSeries
      summary: Lire une série
      description: Retourne les métadonnées d'une série.
      parameters:
        - $ref: '#/components/parameters/SeriesId'
      responses:
        '200':
          description: Série
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SeriesMetadata'}
        default: {$ref: '#/components/responses/Error'}
  /series/{seriesId}/values:
    get:
      tags: [Series]
      operationId: getSeriesValues
      summary: Lire les valeurs d'une série
      description: Retourne les valeurs temporelles d'une série.
      parameters:
        - $ref: '#/components/parameters/SeriesId'
      responses:
        '200':
          description: Valeurs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SeriesValue'}
        default: {$ref: '#/components/responses/Error'}
  /aggregated-series:
    get:
      tags: [Series]
      operationId: getAggregatedSeries
      summary: Agréger des séries
      description: Agrège les valeurs de séries sur un périmètre UUID.
      parameters:
        - in: query
          name: metricTypeCode
          required: true
          schema: {type: string}
        - in: query
          name: startDate
          schema: {type: string, format: date}
        - in: query
          name: endDate
          schema: {type: string, format: date}
        - in: query
          name: pointIds
          schema: {type: string}
        - in: query
          name: preleveurId
          schema: {type: string, format: uuid}
        - in: query
          name: collecteurId
          schema: {type: string, format: uuid}
        - in: query
          name: sourceId
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Série agrégée
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default: {$ref: '#/components/responses/Error'}
  /aggregated-series/options:
    get:
      tags: [Series]
      operationId: getAggregatedSeriesOptions
      summary: Options d'agrégation
      description: Retourne les métriques et opérateurs disponibles sur un périmètre.
      parameters:
        - in: query
          name: pointIds
          schema: {type: string}
        - in: query
          name: preleveurId
          schema: {type: string, format: uuid}
        - in: query
          name: collecteurId
          schema: {type: string, format: uuid}
        - in: query
          name: sourceId
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Options disponibles
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default: {$ref: '#/components/responses/Error'}
components:
  parameters:
    DeclarationId:
      in: path
      name: declarationId
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    ChunkId:
      in: path
      name: chunkId
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    SourceId:
      in: path
      name: sourceId
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    DeclarantId:
      in: path
      name: declarantId
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    PointId:
      in: path
      name: pointId
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    SeriesId:
      in: path
      name: seriesId
      required: true
      schema:
        type: string
        description: Identifiant technique de série.
    ZoneId:
      in: path
      name: zoneId
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    MonitoringStationAssociationId:
      in: path
      name: associationId
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    DashboardZones:
      in: query
      name: zones
      schema: {type: string}
      description: Codes des zones accessibles séparés par des virgules. Toutes les zones accessibles sont utilisées si le paramètre est absent.
  responses:
    Error:
      description: Erreur
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Uuid:
      type: string
      format: uuid
    Error:
      type: object
      required: [message]
      properties:
        message: {type: string}
        code: {type: string}
        details: {}
    UserSession:
      type: object
      additionalProperties: true
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        email: {type: string, format: email}
        roles:
          type: array
          items: {type: string}
    Declaration:
      type: object
      additionalProperties: true
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        code: {type: string}
        type: {type: string}
        status: {type: string}
        createdAt: {type: string, format: date-time}
    Source:
      type: object
      additionalProperties: true
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        type: {type: string}
        name: {type: string}
    PointPrelevement:
      type: object
      additionalProperties: true
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
    Exploitation:
      type: object
      additionalProperties: true
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        status: {type: string}
        usage: {type: string}
    WaterUse:
      type: object
      additionalProperties: true
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        code: {type: string}
        label: {type: string}
    SeriesMetadata:
      type: object
      additionalProperties: true
      properties:
        id: {type: string}
        metricTypeCode: {type: string}
        pointId: {$ref: '#/components/schemas/Uuid'}
        unit: {type: string}
    SeriesValue:
      type: object
      additionalProperties: true
      properties:
        date: {type: string, format: date}
        value: {type: number}
    ZoneMonitoringStationInput:
      type: object
      additionalProperties: false
      required: [type, stationCode, label]
      properties:
        type:
          type: string
          enum: [PIEZOMETER, FLOW_STATION]
        stationCode:
          type: string
          description: Ancien code BSS ou nouvel identifiant BSS pour un piézomètre, ou code station hydrométrique.
        label: {type: string}
        enabled: {type: boolean, default: true}
    GeoJsonPoint:
      type: object
      required: [type, coordinates]
      properties:
        type: {type: string, const: Point}
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          items: {type: number}
    MonitoringStationSync:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING, READY, ERROR]
        lastAttemptAt: {type: [string, 'null'], format: date-time}
        lastSuccessAt: {type: [string, 'null'], format: date-time}
        lastRealtimeSyncAt: {type: [string, 'null'], format: date-time}
        lastHistoricalSyncAt: {type: [string, 'null'], format: date-time}
        error: {type: [string, 'null']}
    ZoneMonitoringStation:
      type: object
      required: [id, zoneId, label, enabled, type, stationCode, sync]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        zoneId: {$ref: '#/components/schemas/Uuid'}
        label: {type: string}
        enabled: {type: boolean}
        type:
          type: string
          enum: [PIEZOMETER, FLOW_STATION]
        stationCode: {type: string}
        bssId: {type: [string, 'null']}
        siteCode: {type: [string, 'null']}
        providerLabel: {type: [string, 'null']}
        coordinates:
          oneOf:
            - {$ref: '#/components/schemas/GeoJsonPoint'}
            - {type: 'null'}
        sync: {$ref: '#/components/schemas/MonitoringStationSync'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DashboardWaterResourceStation:
      type: object
      required: [id, type, label, stationCode, zones, sync, values]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        type:
          type: string
          enum: [PIEZOMETER, FLOW_STATION]
        label: {type: string}
        stationCode: {type: string}
        bssId: {type: [string, 'null']}
        siteCode: {type: [string, 'null']}
        coordinates:
          oneOf:
            - {$ref: '#/components/schemas/GeoJsonPoint'}
            - {type: 'null'}
        zones:
          type: array
          items:
            type: object
            required: [id, code, name]
            properties:
              id: {$ref: '#/components/schemas/Uuid'}
              code: {type: string}
              name: {type: string}
        sync: {$ref: '#/components/schemas/MonitoringStationSync'}
        latestObservationAt: {type: [string, 'null'], format: date-time}
        values:
          type: array
          description: Mesures de niveau/profondeur ou de débit selon le type de station.
          items:
            type: object
            additionalProperties: true
    DashboardWaterResources:
      type: object
      required: [period, source, aggregation, warnings, stations, selectedZoneCodes, unknownZoneCodes]
      properties:
        period:
          type: object
          required: [key, start, end]
          properties:
            key: {type: string}
            start: {type: string, format: date-time}
            end: {type: string, format: date-time}
        source: {type: string}
        aggregation:
          type: [object, 'null']
          description: Agrégation appliquée par l’API aux valeurs retournées, ou null pour les mesures brutes.
          required: [frequency, operator]
          properties:
            frequency: {type: string, example: 1 week}
            operator: {type: string, enum: [mean]}
        warnings:
          type: array
          items:
            type: object
            additionalProperties: true
        stations:
          type: array
          items: {$ref: '#/components/schemas/DashboardWaterResourceStation'}
        selectedZoneCodes:
          type: array
          items: {type: string}
        unknownZoneCodes:
          type: array
          items: {type: string}
