      properties:
        success: {type: boolean, const: true}
        data:
          type: object
          required: [generatedAt, period, metrics, activity, currentStatus]
          properties:
            generatedAt: {type: string, format: date-time}
            period:
              type: object
              required: [startDate, endDate, days]
              properties:
                startDate: {type: string, format: date}
                endDate: {type: string, format: date}
                days: {type: integer, minimum: 1, maximum: 366}
            metrics:
              type: object
              required: [declarationsReceived, manualDeclarationsReceived, spreadsheetDeclarationsReceived, otherDeclarationsReceived, declarationsFailed, telemetryTransmissionsReceived, telemetryTransmissionsFailed, notificationRecipientsSent, notificationRecipientsFailed]
              properties:
                declarationsReceived:
                  type: integer
                  minimum: 0
