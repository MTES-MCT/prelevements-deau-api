            currentStatus:
              type: object
              required: [declarationsInProgress, replayableDeclarations, notificationRuns]
              properties:
                declarationsInProgress: {type: integer, minimum: 0}
                replayableDeclarations: {type: integer, minimum: 0}
                notificationRuns:
                  type: object
                  required: [count, failedRecipients]
                  properties:
                    count: {type: integer, minimum: 0}
                    failedRecipients: {type: integer, minimum: 0}
