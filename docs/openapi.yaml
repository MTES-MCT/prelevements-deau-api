          type: string
          description: Ancien code BSS ou nouvel identifiant BSS pour un piézomètre, ou code station hydrométrique.
        label: {type: string}
        enabled: {type: boolean, default: true}
    GeoJsonPoint:
      type: object
      required: [type, coordinates]
      properties:
        type: {type: string, const: Point}
        coordinates:
          type: array
          minItems: 2
          maxItems: 2
          items: {type: number}
    MonitoringStationSync:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PENDING, READY, ERROR]
        lastAttemptAt: {type: [string, 'null'], format: date-time}
        lastSuccessAt: {type: [string, 'null'], format: date-time}
        lastRealtimeSyncAt: {type: [string, 'null'], format: date-time}
        lastHistoricalSyncAt: {type: [string, 'null'], format: date-time}
        error: {type: [string, 'null']}
    ZoneMonitoringStation:
      type: object
      required: [id, zoneId, label, enabled, type, stationCode, sync]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        zoneId: {$ref: '#/components/schemas/Uuid'}
        label: {type: string}
        enabled: {type: boolean}
        type:
          type: string
          enum: [PIEZOMETER, FLOW_STATION]
        stationCode: {type: string}
        bssId: {type: [string, 'null']}
        siteCode: {type: [string, 'null']}
        providerLabel: {type: [string, 'null']}
        coordinates:
          oneOf:
            - {$ref: '#/components/schemas/GeoJsonPoint'}
            - {type: 'null'}
        sync: {$ref: '#/components/schemas/MonitoringStationSync'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    DashboardWaterResourceStation:
      type: object
      required: [id, type, label, stationCode, details, zones, sync, values]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        type:
          type: string
          enum: [PIEZOMETER, FLOW_STATION]
        label: {type: string}
        stationCode: {type: string}
        bssId: {type: [string, 'null']}
        siteCode: {type: [string, 'null']}
        providerLabel: {type: [string, 'null']}
        coordinates:
          oneOf:
            - {$ref: '#/components/schemas/GeoJsonPoint'}
            - {type: 'null'}
        details:
          type: object
          required: [commune, department, altitudeMeters, investigationDepthMeters, watercourse, openedAt, closedAt, inService]
          properties:
            commune: {type: [string, 'null']}
            department: {type: [string, 'null']}
            altitudeMeters: {type: [number, 'null']}
            investigationDepthMeters: {type: [number, 'null']}
            watercourse: {type: [string, 'null']}
            openedAt: {type: [string, 'null']}
            closedAt: {type: [string, 'null']}
            inService: {type: [boolean, 'null']}
        zones:
          type: array
          items:
            type: object
            required: [id, code, name]
            properties:
              id: {$ref: '#/components/schemas/Uuid'}
              code: {type: string}
              name: {type: string}
        sync: {$ref: '#/components/schemas/MonitoringStationSync'}
        latestObservationAt: {type: [string, 'null'], format: date-time}
        values:
          type: array
          description: Mesures de niveau/profondeur ou de débit selon le type de station.
          items:
            type: object
            additionalProperties: true
    DashboardWaterResources:
      type: object
      required: [period, source, aggregation, warnings, stations, selectedZoneCodes, unknownZoneCodes]
      properties:
        period:
          type: object
          required: [key, start, end]
          properties:
            key: {type: string}
            start: {type: string, format: date-time}
            end: {type: string, format: date-time}
        source: {type: string}
        aggregation:
          type: [object, 'null']
          description: Agrégation appliquée par l’API aux valeurs retournées, ou null pour les mesures brutes.
          required: [frequency, operator]
          properties:
            frequency: {type: string, example: 1 week}
            operator: {type: string, enum: [mean]}
        warnings:
          type: array
          items:
            type: object
            additionalProperties: true
        stations:
          type: array
          items: {$ref: '#/components/schemas/DashboardWaterResourceStation'}
        selectedZoneCodes:
          type: array
          items: {type: string}
        unknownZoneCodes:
          type: array
          items: {type: string}
